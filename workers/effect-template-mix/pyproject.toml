[project]
name = "effect-template-mix-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.5.7,<10",
  "httpx>=0.28.1,<1",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.12.0,<3",
]

[project.scripts]
effect-template-mix-worker = "effect_template_mix.main:main"

[dependency-groups]
dev = ["pytest>=8.4.2,<10", "pytest-asyncio>=1.2.0,<2", "mypy>=1.18.2,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effect_template_mix"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["effect_template_mix"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["aio_pika.*"]
ignore_missing_imports = true
