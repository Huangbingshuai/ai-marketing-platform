[project]
name = "customized-storyboard-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["customized-production-runtime", "ai-runtime", "aio-pika>=9.5.7,<10"]
[project.scripts]
customized-storyboard-worker = "customized_storyboard.main:main"
[dependency-groups]
dev = ["pytest>=8.4.2,<10", "pytest-asyncio>=1.2,<2", "mypy>=1.18,<2", "jsonschema>=4.23,<5"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/customized_storyboard"]
[tool.uv.sources]
customized-production-runtime = { path = "../shared/customized-production-runtime", editable = true }
ai-runtime = { path = "../shared/ai-runtime", editable = true }
[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["customized_storyboard"]
