[project]
name = "seedance-worker"
version = "0.1.0"
description = "Seedance worker for effect-workflow segment rendering"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.5.7,<10",
  "httpx>=0.28.1,<1",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.12.0,<3",
]

[project.scripts]
seedance-worker = "seedance_worker.main:main"

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<10",
  "pytest-asyncio>=1.2.0,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seedance_worker"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["seedance_worker"]
mypy_path = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aio_pika.*"]
ignore_missing_imports = true
