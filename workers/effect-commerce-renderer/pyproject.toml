[project]
name = "effect-commerce-renderer"
version = "0.1.0"
description = "Isolated Playwright renderer for public commerce product pages"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.1,<1",
  "playwright>=1.55.0,<2",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.12.0,<3",
  "uvicorn>=0.35.0,<1",
]

[project.scripts]
effect-commerce-renderer = "effect_commerce_renderer.main:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<10",
  "pytest-asyncio>=1.2.0,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effect_commerce_renderer"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["effect_commerce_renderer"]
mypy_path = ["src"]
warn_unused_ignores = true
