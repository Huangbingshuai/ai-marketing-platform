[project]
name = "extraction-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["docling==2.117.0", "ai-runtime", "httpx>=0.28.1,<1", "pydantic>=2.12.5,<3"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/extraction_runtime"]
[tool.uv.sources]
ai-runtime = { path = "../ai-runtime", editable = true }
