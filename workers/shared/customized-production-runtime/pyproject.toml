[project]
name = "customized-production-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ai-runtime", "aio-pika>=9.5.7,<10"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/customized_production_runtime"]
[tool.uv.sources]
ai-runtime = { path = "../ai-runtime", editable = true }
