[project]
name = "effect-prompt-generation-worker"
version = "0.1.0"
description = "LangGraph worker for differentiated effect-workflow prompt batches"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.5.7,<10",
  "httpx>=0.28.1,<1",
  "langgraph>=1.0.6,<2",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.12.0,<3",
]

[project.scripts]
effect-prompt-generation-worker = "effect_prompt_generation.main:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25.1,<5",
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<10",
  "pytest-asyncio>=1.2.0,<2",
  "types-jsonschema>=4.25.1.20250822,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effect_prompt_generation"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = ["ark_integration: makes paid requests to an explicitly configured Ark endpoint"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["effect_prompt_generation"]
mypy_path = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aio_pika.*"]
ignore_missing_imports = true
