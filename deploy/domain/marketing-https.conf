server {
    listen 443 ssl;
    server_name marketing.richbest.cn;
    ssl_certificate /etc/letsencrypt/live/marketing.richbest.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.richbest.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:marketing_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 512m;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Resolve only on requests so this site's lifecycle cannot block other sites.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;

    location /api/ {
        set $marketing_api http://richi-marketing-api-1:3000;
        proxy_pass $marketing_api$request_uri;
    }

    location / {
        set $marketing_web http://richi-marketing-web-1:80;
        proxy_pass $marketing_web$request_uri;
    }
}
