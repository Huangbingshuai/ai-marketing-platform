server {
    listen 80;
    server_name marketing.richbest.cn;
    access_log off;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/marketing-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://marketing.richbest.cn$request_uri;
    }
}
