<script data-unified-regenerate-dialog>
/*
 * 全系统统一“重新生成”意见组件。
 * 通过捕获阶段事件委托兼容静态按钮、Vue 动态按钮及构建注入按钮；
 * 确认后仍执行按钮原有处理逻辑，不改变各业务模块的 Mock 流程。
 */
(() => {
  'use strict';

  if (window.__unifiedRegenerateDialogInstalled) return;
  window.__unifiedRegenerateDialogInstalled = true;

  const bypassButtons = new WeakSet();
  const regeneratePattern = /(重新生成|重新渲染|重新解析|重新拆解|重新提取|重新识别|重新校验|重生成|批量全部刷新)/;
  const feedbackSelectors = [
    'textarea[data-regenerate-feedback]',
    'textarea.gaw-note',
    'textarea.va-revision',
    'textarea[class*="revision"]',
    'textarea[class*="suggestion"]',
    'textarea[placeholder*="修改意见"]',
    'textarea[placeholder*="修改建议"]',
    'textarea[placeholder*="修正建议"]'
  ].join(',');
  const quickSuggestions = [
    '保持主体一致，仅优化画面细节',
    '调整构图与镜头节奏，突出核心卖点',
    '统一色温与光影，增强前后镜头连续性',
    '修正文字、口播与画面的对应关系'
  ];

  let root = null;
  let activeRequest = null;

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[character]);
  }

  function buttonText(button) {
    return (button.getAttribute('aria-label') || button.textContent || '').replace(/\s+/g, ' ').trim();
  }

  /* 将各业务原型里的历史文案统一成同一套“重新生成”入口。 */
  function normalizeRegenerateEntrypoints() {
    document.querySelectorAll('button').forEach(button => {
      /* 效果类按钮由 Vue 管理；直接重写 textContent 会破坏其动态生成时的 VDOM。 */
      const isEffectVueButton = document.documentElement.dataset.uwfContext === 'effect'
        && Array.from(button.attributes).some(attribute => attribute.name.startsWith('data-v-'));
      if (isEffectVueButton) return;
      const text = buttonText(button);
      let normalized = '';
      if (/重新\s*AI\s*提取/.test(text)) normalized = '↻ 重新生成 AI 提取结果';
      else if (/一键批量全部刷新/.test(text)) normalized = '↻ 批量重新生成 Prompt';
      else if (/批量重生成/.test(text)) normalized = '↻ 批量重新生成';
      else if (/^重新拆解$/.test(text)) normalized = '↻ 重新生成拆解报告';
      else if (/^重新解析$/.test(text)) normalized = '↻ 重新生成解析结果';
      else if (/生成多版分镜脚本/.test(text) && document.querySelector('.version-button') && button.dataset.storyboardGenerated === 'true') normalized = '↻ 重新生成多版本分镜脚本';

  function isRegenerateButton(button) {
    // 具备独立修改意见流程的组件可显式隔离，避免捕获阶段抢占自身按钮。
    if (!button || button.disabled || button.closest('.urd-dialog, [data-regenerate-bypass]')) return false;

      cursor = cursor.parentElement;

    for (const container of containers) {

      if (field) return field;

  function inferTarget(button) {

    if (container) {
      const title = container.querySelector('[data-regenerate-name], h2, h3, h4, strong, b, .task-title, .asset-name');
      const text = title && (title.getAttribute('data-regenerate-name') || title.textContent || '').replace(/\s+/g, ' ').trim();
      if (text && text.length <= 80 && !regeneratePattern.test(text)) return text;
    }
    const action = buttonText(button).replace(/[↻✦＋+]/g, '').trim();
    return action || '当前内容';
  }

    style.textContent = `

      .urd-title{min-width:0;flex:1}.urd-title strong{display:block;font-size:17px;line-height:1.35}.urd-title span{display:block;margin-top:5px;color:#7b879b;font-size:12px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.urd-close{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:#64748b;font-size:22px;cursor:pointer}.urd-close:hover{background:#f1f5f9;color:#1e293b}
      .urd-body{padding:18px 22px}.urd-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;font-weight:700}.urd-label small{color:#ef5366;font-size:11px;font-weight:500}.urd-feedback{display:block;width:100%;min-height:116px;resize:vertical;padding:12px 13px;border:1px solid #d7dfeb;border-radius:9px;background:#fbfcfe;color:#24324a;font:13px/1.65 inherit;outline:none;box-sizing:border-box}.urd-feedback:focus{border-color:#4f8df7;background:#fff;box-shadow:0 0 0 3px rgba(79,141,247,.12)}.urd-feedback.invalid{border-color:#ef6a76;box-shadow:0 0 0 3px rgba(239,83,102,.1)}
      .urd-suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.urd-suggestion{padding:6px 9px;border:1px solid #dbe5f5;border-radius:999px;background:#f7faff;color:#526078;font-size:11px;cursor:pointer}.urd-suggestion:hover{border-color:#9abcf4;background:#eef5ff;color:#2563eb}.urd-tip{margin:12px 0 0;padding:9px 11px;border-radius:7px;background:#f5f8fc;color:#78869a;font-size:11px;line-height:1.55}

      const action = event.target.closest('[data-urd-action]')?.dataset.urdAction;

  function openDialog(options = {}) {
    const dialog = ensureDialog();
    const trigger = options.trigger || null;
    const linkedField = options.feedbackField || (trigger ? closestFeedbackField(trigger) : null);
    const target = options.target || (trigger ? inferTarget(trigger) : '当前内容');
    const initialFeedback = options.feedback || (linkedField && linkedField.value) || (trigger && trigger.dataset.regenerateFeedback) || '';
    activeRequest = { trigger, linkedField, target, onConfirm: options.onConfirm || null };
    dialog.querySelector('[data-urd-target]').textContent = `重新生成对象：${target}`;
    const feedback = dialog.querySelector('.urd-feedback');
    feedback.value = initialFeedback;
    feedback.classList.remove('invalid');
    dialog.querySelector('[data-urd-action="confirm"]').disabled = !initialFeedback.trim();
    dialog.classList.add('open');
    document.documentElement.style.setProperty('--urd-open', '1');
    setTimeout(() => feedback.focus(), 0);
  }

  function closeDialog() {
    if (!root) return;
    root.classList.remove('open');
    activeRequest = null;
    document.documentElement.style.removeProperty('--urd-open');
  }

  function confirmRegenerate() {
    if (!root || !activeRequest) return;
    const feedbackField = root.querySelector('.urd-feedback');
    const feedback = feedbackField.value.trim();
    if (!feedback) {
      feedbackField.classList.add('invalid');
      feedbackField.focus();
      return;
    }
    const request = activeRequest;
    const detail = {
      feedback,
      target: request.target,
      action: request.trigger ? buttonText(request.trigger) : '重新生成',
      submittedAt: new Date().toISOString()
    };
    window.__lastRegenerateRequest = detail;
    if (request.linkedField) {
      request.linkedField.value = feedback;
      request.linkedField.dispatchEvent(new Event('input', { bubbles: true }));
      request.linkedField.dispatchEvent(new Event('change', { bubbles: true }));
    }
    if (request.trigger) {
      request.trigger.dataset.regenerateFeedback = feedback;
      request.trigger.dispatchEvent(new CustomEvent('unified-regenerate-confirmed', { bubbles: true, composed: true, detail }));
    }
    closeDialog();
    if (typeof request.onConfirm === 'function') request.onConfirm(detail);
    if (request.trigger && request.trigger.isConnected) {
      bypassButtons.add(request.trigger);
      request.trigger.click();
    }
  }

  document.addEventListener('click', event => {
    const button = event.target.closest && event.target.closest('button');
    if (!button) return;
    if (bypassButtons.has(button)) {
      bypassButtons.delete(button);
      return;
    }
    if (!isRegenerateButton(button)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    openDialog({ trigger: button });
  }, true);

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && root?.classList.contains('open')) closeDialog();
  });

  let normalizeQueued = false;
  const queueNormalize = () => {
    if (normalizeQueued) return;
    normalizeQueued = true;
    requestAnimationFrame(() => {
      normalizeQueued = false;
      normalizeRegenerateEntrypoints();
    });
  };
  new MutationObserver(queueNormalize).observe(document.documentElement, { childList: true, subtree: true });
  queueNormalize();

  window.UnifiedRegenerateDialog = Object.freeze({
    open: openDialog,
    close: closeDialog,
    isRegenerateButton,
    getLastRequest: () => window.__lastRegenerateRequest || null
  });
})();

  `;
  document.head.appendChild(style);

  const protectedArea = [
    '.effect-magic-mix-host',
    '.editor-shell',
    '.timeline-shell',
    '.timeline-area',
    '.lr-shell',
    '.guided-replace-panel',
    '.va-workbench',
    '.avatar-studio-host'
  ].join(',');

  function isProtected(node) {
    return context === 'mix' || Boolean(node.closest?.(protectedArea));
  }

  function addClass(selector, className, options = {}) {
    document.querySelectorAll(selector).forEach(node => {
      if (options.skipProtected && isProtected(node)) return;
      node.classList.add(...className.split(' '));
    });
  }

  function decorateFooters() {
    document.querySelectorAll('.step-footer,.nav-footer').forEach(footer => {
      if (isProtected(footer)) return;
      footer.classList.add('uwf-footer');
      const buttons = Array.from(footer.querySelectorAll('button'));
      const previous = buttons.find(button => /上一步|返回上一步/.test(button.textContent || ''));
      const next = buttons.find(button => /下一步|完成|提交|进入|导出/.test(button.textContent || '') && button !== previous)
        || buttons.at(-1);
      if (previous) previous.classList.add('uwf-prev');
      if (next && next !== previous) next.classList.add('uwf-next');
      const directChildren = Array.from(footer.children);
      const progress = directChildren.find(node => node.classList.contains('progress'))
        || directChildren.find(node => node.tagName === 'SPAN')
        || directChildren.find(node => /步骤\s*\d+\s*\/\s*\d+/.test(node.textContent || ''));
      if (progress) progress.classList.add('uwf-progress');
    });
  }

  function decorateStatuses() {
    document.querySelectorAll('.status,.effect-export-status,.preview-status,.render-status,.el-tag').forEach(node => {
      if (isProtected(node)) return;
      const text = (node.textContent || '').trim();
      if (!text || text.length > 18) return;
      node.classList.add('uwf-status');
      node.classList.remove('uwf-status-success','uwf-status-running','uwf-status-warning','uwf-status-danger');
      if (/失败|错误|异常|驳回/.test(text)) node.classList.add('uwf-status-danger');
      else if (/生成中|渲染中|处理中|同步中|进行中|加载中/.test(text)) node.classList.add('uwf-status-running');
      else if (/警告|待修|待更新|草稿|风险|待处理/.test(text)) node.classList.add('uwf-status-warning');
      else if (/完成|通过|成功|已保存|已入库|已同步/.test(text)) node.classList.add('uwf-status-success');
    });
  }

  function decorateControls() {
    if (context === 'mix') return;
    document.querySelectorAll('.el-button--primary,.primary,.primary-button,.effect-export-btn.primary,.urd-btn.primary').forEach(node => {
      if (!isProtected(node) && !node.classList.contains('mini') && !node.classList.contains('tiny')) {
        node.classList.remove('uwf-secondary');
        node.classList.add('uwf-primary');
      }
    });
    document.querySelectorAll('.el-button:not(.el-button--primary),.secondary,.effect-export-btn:not(.primary),.urd-btn:not(.primary)').forEach(node => {
      if (!isProtected(node) && !node.classList.contains('uwf-primary') && !node.classList.contains('primary-button') && !node.classList.contains('primary') && !node.classList.contains('mini') && !node.classList.contains('tiny')) node.classList.add('uwf-secondary');
    });
    document.querySelectorAll('.danger,.el-button--danger').forEach(node => {
      if (!isProtected(node)) node.classList.add('uwf-danger');
    });
    document.querySelectorAll('.el-input__wrapper,.el-select__wrapper,.el-textarea__inner,input[type="text"],input[type="url"],select,textarea').forEach(node => {
      if (isProtected(node) || node.closest('table,.compact,.count-input,.duration-editor')) return;
      node.classList.add('uwf-control');
    });
  }

  function decorateCompactActions() {
    if (context === 'mix') return;
    addClass('.prompt-actions,.result-actions,.render-toolbar-actions,.effect-render-inline-actions', 'uwf-compact-actions', { skipProtected: true });
    addClass('.render-task', 'uwf-render-card', { skipProtected: true });
    document.querySelectorAll('.render-task .task-title').forEach(title => {
      if (isProtected(title)) return;
      Array.from(title.children).forEach(child => {
        if (child.querySelector?.('button')) child.classList.add('uwf-compact-actions');
      });
    });
  }

  const numberedNodeTitles = {
    customized: new Map([
      ['资料包导入', '01'],
      ['AI 信息标准化提炼', '02'],
      ['AI 分镜脚本创作', '03'],
      ['镜头级 Prompt 输出', '04'],
      ['定制化视觉资产生成', '05'],
      ['视频片段逐镜渲染', '06'],
      ['剪辑素材交付', '06']
    ]),
    fission: new Map([
      ['上传参考视频与商品原料', '01'],
      ['爆款视频深度拆解', '02'],
      ['爆款视频六维解析报告', '02'],
      ['元素映射与替换', '03'],
      ['裂变版 Prompt 批量生成', '04'],
      ['成片生成与批量导出', '05']
    ])
  };

  /*
   * 定制类与裂变类的画布标题始终描述“当前节点”，与效果类 WORKFLOW 标题规则一致。
   * 裂变类节点自身的 small 是状态文案，因此使用稳定的业务说明映射。
   */
  const fissionFlowSummaries = new Map([
    ['上传素材', '参考视频与商品原料'],
    ['深度拆解', '结构、创意与镜头解析'],
    ['元素映射', '必替换与可保留元素'],
    ['裂变版 Prompt 生成', '批量差异化提示词'],
    ['成片输出', '生成进度与批量导出'],
    ['选择成片', '选择需要替换的原始成片'],
    ['替换粒度', '选择整片、镜头或局部范围'],
    ['解析与替换', '逐镜解析并绑定替换资产'],
    ['生成提示词', '生成镜头级替换提示词'],
    ['渲染输出', '一致性校验与结果输出']
  ]);

  function getFlowHeadingParts(flow) {
    if (flow.classList.contains('flow-head')) {
      return {
        heading: flow.querySelector('.flow-title-row > div:first-child'),
        nodes: Array.from(flow.querySelectorAll('.node-track > .flow-node')),
        useNodeSummary: true
      };
    }
    if (flow.classList.contains('flow-canvas')) {
      return {
        heading: flow.querySelector(':scope > header > div:first-child'),
        nodes: Array.from(flow.querySelectorAll(':scope > .node-track > .flow-node')),
        useNodeSummary: false
      };
    }
    if (flow.classList.contains('lr-flow')) {
      return {
        heading: flow.querySelector(':scope > header > div:first-child'),
        nodes: Array.from(flow.querySelectorAll(':scope > .lr-nodes > article')),
        useNodeSummary: false
      };
    }
    return { heading: null, nodes: [], useNodeSummary: false };
  }

  function syncFlowHeading(flow) {
    const { heading, nodes, useNodeSummary } = getFlowHeadingParts(flow);
    if (!heading || !nodes.length) return;
    const current = nodes.find(node =>
      node.classList.contains('active')
      || node.classList.contains('current')
      || node.classList.contains('running')
      || node.classList.contains('state-processing')
    ) || nodes[0];
    const currentIndex = Math.max(0, nodes.indexOf(current));
    const title = (current.querySelector('.node-main b,button b,b')?.textContent || '').trim();
    if (!title) return;

    const eyebrow = heading.querySelector('.eyebrow') || heading.querySelector(':scope > span:first-child');
    const titleNode = heading.querySelector('h1,h2,h3');
    if (!eyebrow || !titleNode) return;

    let summary = '';
    if (useNodeSummary) {
      summary = (current.querySelector('.node-main small,button small,small')?.textContent || '').trim();
    } else {
      summary = fissionFlowSummaries.get(title) || '';
    }
    let summaryNode = heading.querySelector(':scope > p');
    if (!summaryNode) {
      summaryNode = document.createElement('p');
      heading.appendChild(summaryNode);
    }

    const stepLabel = `WORKFLOW ${String(currentIndex + 1).padStart(2, '0')}`;
    if (eyebrow.textContent !== stepLabel) eyebrow.textContent = stepLabel;
    if (titleNode.textContent !== title) titleNode.textContent = title;
    if (summaryNode.textContent !== summary) summaryNode.textContent = summary;
    heading.classList.add('uwf-current-flow-title');
  }

  function syncFlowHeadings() {
    if (context === 'customized') {
      document.querySelectorAll('.flow-head').forEach(syncFlowHeading);
    } else if (context === 'fission') {
      document.querySelectorAll('.flow-canvas,.lr-flow').forEach(syncFlowHeading);
    }
  }

  function decorateNodeHeadings() {
    const titleMap = numberedNodeTitles[context];
    if (!titleMap) return;
    const selector = context === 'customized'
      ? '.section-heading'
      : '.frg-head,.fpg-head,.fco-head';
    document.querySelectorAll(selector).forEach(header => {
      const title = header.querySelector('h1,h2,h3');
      const number = titleMap.get((title?.textContent || '').trim());
      if (!number) return;
      const marker = context === 'customized'
        ? header.querySelector('.section-icon')
        : header.querySelector('.frg-step,.fpg-step,.fco-step');
      if (!marker) return;
      marker.classList.add('uwf-node-number');
      marker.setAttribute('aria-label', `步骤 ${number}`);
      marker.removeAttribute('data-app-icon');
      if (marker.childElementCount || marker.textContent.trim() !== number) {
        marker.replaceChildren(document.createTextNode(number));
      }
    });
  }

  function decorate() {
    decorateFooters();
    addClass('.flow-head,.flow-canvas,.lr-flow', 'uwf-flow');
    addClass('.node-track,.steps-bar,.lr-nodes', 'uwf-flow-track');
    addClass('.node-track > .flow-node,.lr-nodes > article', 'uwf-flow-node');
    addClass('.steps-bar > .step-node', 'uwf-step-node');
    addClass('.section-heading,.panel-title,.lr-panel-head,.effect-export-head,.frg-head,.fpg-head,.fco-head', 'uwf-section-head', { skipProtected: true });
    addClass('.render-pager,.prompt-pager,.effect-export-pager,.asset-pagination,.pagination,.fem-pager,.fem-library-pager,.fco-pager,.fpg-pager,.global-avatar-pager,.fas-pager', 'uwf-pagination', { skipProtected: true });
    addClass('.el-progress-bar__outer,.render-bar,.effect-export-progress-track,.effect-export-card-progress .bar,.urd-progress', 'uwf-progress-track', { skipProtected: true });
    addClass('.modal-card,.el-dialog,.urd-dialog,.cpa-dialog,.render-dialog', 'uwf-modal', { skipProtected: true });
    addClass('.modal-mask,.el-overlay,.cpa-mask,.render-asset-mask', 'uwf-mask', { skipProtected: true });
    addClass('.el-message,.effect-export-toast,.cpa-toast,.render-toast', 'uwf-toast', { skipProtected: true });
    decorateStatuses();
    decorateControls();
    decorateCompactActions();
    decorateNodeHeadings();
    syncFlowHeadings();
  }

  let queued = false;
  function queueDecorate() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      decorate();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', queueDecorate, { once: true });
  else queueDecorate();

  /* 节点切换通常只更新 class，不一定产生子节点变更；点击后在框架完成状态更新时同步标题。 */
  document.addEventListener('click', () => {
    setTimeout(queueDecorate, 0);
  }, true);

  const startObserver = () => {
    if (!document.body) return;
    new MutationObserver(mutations => {
      if (mutations.some(mutation => mutation.addedNodes.length || mutation.removedNodes.length)) queueDecorate();
    }).observe(document.body, { childList: true, subtree: true });
  };
  if (document.body) startObserver();
  else document.addEventListener('DOMContentLoaded', startObserver, { once: true });
})();
