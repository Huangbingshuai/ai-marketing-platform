name: ai-marketing-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_marketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_marketing']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./infrastructure/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  docling-model-init:
    profiles: ['effect-extraction']
    build:
      context: ./workers/effect-extraction
    command: ['/app/.venv/bin/effect-extraction-download-models']
    environment:
      DOCLING_ARTIFACTS_PATH: /root/.cache/docling/models
    volumes:
      - docling-models:/root/.cache/docling/models
    restart: 'no'

  effect-extraction-worker:
    profiles: ['effect-extraction']
    build:
      context: ./workers/effect-extraction
    environment:
      INTERNAL_API_BASE_URL: http://host.docker.internal:${API_PORT:-3000}/api
      EFFECT_EXTRACTION_WORKER_TOKEN: ${EFFECT_EXTRACTION_WORKER_TOKEN:-local-effect-extraction-worker-token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EFFECT_EXTRACTION_QUEUE: effect.extraction.requested
      EXTRACTION_AI_PROVIDER: ${EXTRACTION_AI_PROVIDER:-ark}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_DOCUMENT_MODEL: ${ARK_DOCUMENT_MODEL:-}
      ARK_IMAGE_MODEL: ${ARK_IMAGE_MODEL:-}
      ARK_NORMALIZATION_MODEL: ${ARK_NORMALIZATION_MODEL:-}
      DOCLING_ARTIFACTS_PATH: /root/.cache/docling/models
      DOCLING_DEVICE: cpu
      OMP_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
    volumes:
      - docling-models:/root/.cache/docling/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      docling-model-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  docling-models:
