name: ai-marketing-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_marketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_marketing']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./infrastructure/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  docling-model-init:
    profiles: ['effect-extraction']
    build:
      context: ./workers/effect-extraction
    command: ['/app/.venv/bin/effect-extraction-download-models']
    user: root
    environment:
      DOCLING_ARTIFACTS_PATH: /models
    volumes:
      - docling-models:/models
    restart: 'no'

  effect-extraction-worker:
    profiles: ['effect-extraction']
    build:
      context: ./workers/effect-extraction
    environment:
      INTERNAL_API_BASE_URL: http://host.docker.internal:${API_PORT:-3000}/api
      EFFECT_EXTRACTION_WORKER_TOKEN: ${EFFECT_EXTRACTION_WORKER_TOKEN:-local-effect-extraction-worker-token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EFFECT_EXTRACTION_QUEUE: effect.extraction.requested
      EXTRACTION_AI_PROVIDER: ${EXTRACTION_AI_PROVIDER:-ark}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_DOCUMENT_MODEL: ${ARK_DOCUMENT_MODEL:-doubao-seed-2-1-pro-260628}
      ARK_DOCUMENT_TIMEOUT_SECONDS: ${ARK_DOCUMENT_TIMEOUT_SECONDS:-180}
      ARK_DOCUMENT_MAX_ATTEMPTS: ${ARK_DOCUMENT_MAX_ATTEMPTS:-1}
      ARK_DOCUMENT_MAX_OUTPUT_TOKENS: ${ARK_DOCUMENT_MAX_OUTPUT_TOKENS:-8192}
      ARK_DOCUMENT_REASONING_EFFORT: ${ARK_DOCUMENT_REASONING_EFFORT:-minimal}
      DOCUMENT_CHUNK_TEXT_CHARS: ${DOCUMENT_CHUNK_TEXT_CHARS:-12000}
      DOCUMENT_MAX_CONCURRENCY: ${DOCUMENT_MAX_CONCURRENCY:-2}
      ARK_IMAGE_MODEL: ${ARK_IMAGE_MODEL:-}
      ARK_IMAGE_DETAIL: ${ARK_IMAGE_DETAIL:-low}
      ARK_IMAGE_REASONING_EFFORT: ${ARK_IMAGE_REASONING_EFFORT:-minimal}
      ARK_IMAGE_ADAPTIVE_HIGH_DETAIL: ${ARK_IMAGE_ADAPTIVE_HIGH_DETAIL:-true}
      ARK_IMAGE_TIMEOUT_SECONDS: ${ARK_IMAGE_TIMEOUT_SECONDS:-90}
      ARK_IMAGE_MAX_ATTEMPTS: ${ARK_IMAGE_MAX_ATTEMPTS:-2}
      ARK_IMAGE_MAX_OUTPUT_TOKENS: ${ARK_IMAGE_MAX_OUTPUT_TOKENS:-4096}
      ARK_IMAGE_RETRY_MAX_OUTPUT_TOKENS: ${ARK_IMAGE_RETRY_MAX_OUTPUT_TOKENS:-6144}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-1280}
      IMAGE_MAX_CONCURRENCY: ${IMAGE_MAX_CONCURRENCY:-2}
      ARK_COMMERCE_MODEL: ${ARK_COMMERCE_MODEL:-}
      ARK_SEMANTIC_MODEL: ${ARK_SEMANTIC_MODEL:-doubao-seed-2-1-pro-260628}
      ARK_SEMANTIC_TIMEOUT_SECONDS: ${ARK_SEMANTIC_TIMEOUT_SECONDS:-30}
      ARK_SEMANTIC_MAX_ATTEMPTS: ${ARK_SEMANTIC_MAX_ATTEMPTS:-1}
      ARK_SEMANTIC_MAX_OUTPUT_TOKENS: ${ARK_SEMANTIC_MAX_OUTPUT_TOKENS:-3072}
      ARK_SEMANTIC_REASONING_EFFORT: ${ARK_SEMANTIC_REASONING_EFFORT:-minimal}
      ARK_SEMANTIC_USER_REVIEW_REASONING_EFFORT: ${ARK_SEMANTIC_USER_REVIEW_REASONING_EFFORT:-minimal}
      ARK_NORMALIZATION_MODEL: ${ARK_NORMALIZATION_MODEL:-}
      COMMERCE_RENDERER_MAX_CONCURRENCY: ${COMMERCE_RENDERER_MAX_CONCURRENCY:-2}
      COMMERCE_RENDERER_TIMEOUT_SECONDS: ${COMMERCE_RENDERER_TIMEOUT_SECONDS:-25}
      COMMERCE_RENDERER_MAX_DOM_BYTES: ${COMMERCE_RENDERER_MAX_DOM_BYTES:-2097152}
      COMMERCE_RENDERER_SETTLE_MILLISECONDS: ${COMMERCE_RENDERER_SETTLE_MILLISECONDS:-750}
      DOCLING_ARTIFACTS_PATH: /models
      DOCLING_DEVICE: cpu
      OMP_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
    volumes:
      - docling-models:/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      docling-model-init:
        condition: service_completed_successfully
    init: true
    shm_size: '1gb'
    restart: unless-stopped

  effect-prompt-generation-worker:
    profiles: ['effect-prompt-generation']
    build:
      context: ./workers/effect-prompt-generation
    environment:
      INTERNAL_API_BASE_URL: http://host.docker.internal:${API_PORT:-3000}/api
      EFFECT_PROMPT_WORKER_TOKEN: ${EFFECT_PROMPT_WORKER_TOKEN:-local-effect-prompt-worker-token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EFFECT_PROMPT_QUEUE: effect.prompt-generation.requested
      PROMPT_AI_PROVIDER: ${PROMPT_AI_PROVIDER:-ark}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_PROMPT_MODEL: ${ARK_PROMPT_MODEL:-}
      ARK_PROMPT_STRATEGY_MODEL: ${ARK_PROMPT_STRATEGY_MODEL:-}
      ARK_PROMPT_VISUAL_STRATEGY_MODEL: ${ARK_PROMPT_VISUAL_STRATEGY_MODEL:-}
      ARK_PROMPT_VISUAL_STRATEGY_IMAGE_DETAIL: ${ARK_PROMPT_VISUAL_STRATEGY_IMAGE_DETAIL:-high}
      PROMPT_VISUAL_REFERENCE_MAX_INPUT_BYTES: ${PROMPT_VISUAL_REFERENCE_MAX_INPUT_BYTES:-20971520}
      PROMPT_VISUAL_REFERENCE_MAX_DIMENSION: ${PROMPT_VISUAL_REFERENCE_MAX_DIMENSION:-1280}
      PROMPT_VISUAL_REFERENCE_MAX_OUTPUT_BYTES: ${PROMPT_VISUAL_REFERENCE_MAX_OUTPUT_BYTES:-4194304}
      ARK_PROMPT_FRAGMENT_STRATEGY_MODEL: ${ARK_PROMPT_FRAGMENT_STRATEGY_MODEL:-}
      ARK_PROMPT_BLUEPRINT_MODEL: ${ARK_PROMPT_BLUEPRINT_MODEL:-}
      ARK_PROMPT_CANDIDATE_MODEL: ${ARK_PROMPT_CANDIDATE_MODEL:-}
      ARK_PROMPT_EVALUATION_MODEL: ${ARK_PROMPT_EVALUATION_MODEL:-}
      PROMPT_SIMILARITY_MODE: ${PROMPT_SIMILARITY_MODE:-vector}
      ARK_PROMPT_EMBEDDING_MODEL: ${ARK_PROMPT_EMBEDDING_MODEL:-doubao-embedding-vision-251215}
      ARK_PROMPT_EMBEDDING_API_MODE: ${ARK_PROMPT_EMBEDDING_API_MODE:-multimodal}
      ARK_PROMPT_EMBEDDING_TIMEOUT_SECONDS: ${ARK_PROMPT_EMBEDDING_TIMEOUT_SECONDS:-30}
      ARK_PROMPT_EMBEDDING_MAX_ATTEMPTS: ${ARK_PROMPT_EMBEDDING_MAX_ATTEMPTS:-3}
      PROMPT_EMBEDDING_BATCH_SIZE: ${PROMPT_EMBEDDING_BATCH_SIZE:-64}
      PROMPT_EMBEDDING_MAX_CONCURRENCY: ${PROMPT_EMBEDDING_MAX_CONCURRENCY:-8}
      ARK_PROMPT_STRATEGY_MAX_OUTPUT_TOKENS: ${ARK_PROMPT_STRATEGY_MAX_OUTPUT_TOKENS:-8192}
      ARK_PROMPT_FRAGMENT_STRATEGY_MAX_OUTPUT_TOKENS: ${ARK_PROMPT_FRAGMENT_STRATEGY_MAX_OUTPUT_TOKENS:-3072}
      ARK_PROMPT_CANDIDATE_MAX_OUTPUT_TOKENS: ${ARK_PROMPT_CANDIDATE_MAX_OUTPUT_TOKENS:-8192}
      ARK_PROMPT_EVALUATION_MAX_OUTPUT_TOKENS: ${ARK_PROMPT_EVALUATION_MAX_OUTPUT_TOKENS:-8192}
      PROMPT_EVALUATION_INPUT_TOKEN_BUDGET: ${PROMPT_EVALUATION_INPUT_TOKEN_BUDGET:-12000}
      ARK_PROMPT_REASONING_EFFORT: ${ARK_PROMPT_REASONING_EFFORT:-minimal}
      PROMPT_MAX_CONCURRENCY: ${PROMPT_MAX_CONCURRENCY:-4}
      PROMPT_SHARD_SIZE: ${PROMPT_SHARD_SIZE:-8}
      PROMPT_MAX_AI_CALLS_PER_RUN: ${PROMPT_MAX_AI_CALLS_PER_RUN:-256}
      INTERNAL_API_TIMEOUT_SECONDS: ${INTERNAL_API_TIMEOUT_SECONDS:-60}
      ARK_TIMEOUT_SECONDS: ${ARK_TIMEOUT_SECONDS:-120}
      ARK_PROMPT_STRATEGY_TIMEOUT_SECONDS: ${ARK_PROMPT_STRATEGY_TIMEOUT_SECONDS:-180}
      ARK_PROMPT_DIRECTION_REVIEW_TIMEOUT_SECONDS: ${ARK_PROMPT_DIRECTION_REVIEW_TIMEOUT_SECONDS:-180}
      PROMPT_DIRECTION_REVIEW_BATCH_SIZE: ${PROMPT_DIRECTION_REVIEW_BATCH_SIZE:-6}
      PROMPT_DIRECTION_REVIEW_INPUT_BUDGET: ${PROMPT_DIRECTION_REVIEW_INPUT_BUDGET:-12000}
      ARK_PROMPT_FRAGMENT_STRATEGY_TIMEOUT_SECONDS: ${ARK_PROMPT_FRAGMENT_STRATEGY_TIMEOUT_SECONDS:-120}
      ARK_PROMPT_CANDIDATE_TIMEOUT_SECONDS: ${ARK_PROMPT_CANDIDATE_TIMEOUT_SECONDS:-120}
      ARK_PROMPT_PROVIDER_MAX_ATTEMPTS: ${ARK_PROMPT_PROVIDER_MAX_ATTEMPTS:-3}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  seedance-worker:
    profiles: ['effect-segment-render']
    build:
      context: ./workers/seedance-worker
    environment:
      INTERNAL_API_BASE_URL: http://host.docker.internal:${API_PORT:-3000}/api
      EFFECT_SEGMENT_RENDER_WORKER_TOKEN: ${EFFECT_SEGMENT_RENDER_WORKER_TOKEN:-local-effect-segment-render-worker-token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EFFECT_SEGMENT_RENDER_QUEUE: effect.segment-render.requested
      SEGMENT_RENDER_PROVIDER: ${SEGMENT_RENDER_PROVIDER:-ark}
      SEEDANCE_BASE_URL: ${SEEDANCE_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      SEEDANCE_API_KEY: ${SEEDANCE_API_KEY:-${ARK_API_KEY:-}}
      SEEDANCE_TIMEOUT_SECONDS: ${SEEDANCE_TIMEOUT_SECONDS:-900}
      SEEDANCE_POLL_INTERVAL_SECONDS: ${SEEDANCE_POLL_INTERVAL_SECONDS:-8}
      SEGMENT_RENDER_MAX_INFLIGHT: ${SEGMENT_RENDER_MAX_INFLIGHT:-${SEGMENT_RENDER_MAX_CONCURRENCY:-20}}
      SEGMENT_RENDER_CREATE_QPS: ${SEGMENT_RENDER_CREATE_QPS:-3}
      SEGMENT_RENDER_DOWNLOAD_CONCURRENCY: ${SEGMENT_RENDER_DOWNLOAD_CONCURRENCY:-3}
      SEGMENT_RENDER_REFERENCE_CACHE_BYTES: ${SEGMENT_RENDER_REFERENCE_CACHE_BYTES:-134217728}
      INTERNAL_API_TIMEOUT_SECONDS: ${INTERNAL_API_TIMEOUT_SECONDS:-60}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  effect-template-mix-worker:
    profiles: ['effect-template-mix']
    build:
      context: ./workers/effect-template-mix
    environment:
      INTERNAL_API_BASE_URL: http://host.docker.internal:${API_PORT:-3000}/api
      EFFECT_TEMPLATE_MIX_WORKER_TOKEN: ${EFFECT_TEMPLATE_MIX_WORKER_TOKEN:-local-effect-template-mix-worker-token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EFFECT_TEMPLATE_MIX_QUEUE: effect.template-mix.requested
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_TEMPLATE_MIX_MODEL: ${ARK_TEMPLATE_MIX_MODEL:-}
      ARK_TIMEOUT_SECONDS: ${ARK_TIMEOUT_SECONDS:-120}
      ARK_TEMPLATE_MIX_MAX_OUTPUT_TOKENS: ${ARK_TEMPLATE_MIX_MAX_OUTPUT_TOKENS:-8192}
      ARK_TEMPLATE_MIX_REASONING_EFFORT: ${ARK_TEMPLATE_MIX_REASONING_EFFORT:-minimal}
      TEMPLATE_MIX_CLASSIFICATION_BATCH_SIZE: ${TEMPLATE_MIX_CLASSIFICATION_BATCH_SIZE:-10}
      TEMPLATE_MIX_CLASSIFICATION_INPUT_TOKEN_BUDGET: ${TEMPLATE_MIX_CLASSIFICATION_INPUT_TOKEN_BUDGET:-16000}
      TEMPLATE_MIX_AI_MAX_CONCURRENCY: ${TEMPLATE_MIX_AI_MAX_CONCURRENCY:-2}
      INTERNAL_API_TIMEOUT_SECONDS: ${INTERNAL_API_TIMEOUT_SECONDS:-90}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  docling-models:
