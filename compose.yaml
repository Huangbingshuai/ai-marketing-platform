name: ai-marketing-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_marketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_marketing']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  docling-model-init:
    profiles: ['effect-extraction']
    build:
      context: ./workers/effect-extraction
    command: ['/app/.venv/bin/effect-extraction-download-models']
    environment:
      DOCLING_ARTIFACTS_PATH: /root/.cache/docling/models
    volumes:
      - docling-models:/root/.cache/docling/models
    restart: 'no'

  effect-extraction-worker:
    profiles: ['effect-extraction']
    build:
      context: ./workers/effect-extraction
    environment:
      INTERNAL_API_BASE_URL: http://host.docker.internal:3000/api
      EFFECT_EXTRACTION_WORKER_TOKEN: ${EFFECT_EXTRACTION_WORKER_TOKEN:-local-effect-extraction-worker-token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EFFECT_EXTRACTION_QUEUE: effect.extraction.requested
      EXTRACTION_AI_PROVIDER: ${EXTRACTION_AI_PROVIDER:-mock}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-}
      DOCLING_ARTIFACTS_PATH: /root/.cache/docling/models
      DOCLING_DEVICE: cpu
      OMP_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
    volumes:
      - docling-models:/root/.cache/docling/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      docling-model-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  docling-models:
