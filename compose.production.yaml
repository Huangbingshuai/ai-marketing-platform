name: richi-marketing
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_marketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d ai_marketing
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: '1.0'
    mem_limit: 512m
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: '1.0'
    mem_limit: 192m
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: '1.0'
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: marketing
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
    restart: unless-stopped
  docling-model-init:
    image: richi-marketing-effect-extraction-worker:${RELEASE_TAG:-current}
    build:
      context: ./workers
      dockerfile: effect-extraction/Dockerfile
    command:
      - /app/effect-extraction/.venv/bin/effect-extraction-download-models
    user: root
    environment:
      DOCLING_ARTIFACTS_PATH: /models
      HF_HUB_OFFLINE: ${DOCLING_INIT_OFFLINE:-0}
    volumes:
      - docling-models:/models
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: '1.0'
    mem_limit: 2g
  customized-extraction-worker:
    image: richi-marketing-customized-extraction-worker:${RELEASE_TAG:-current}
    build:
      context: ./workers
      dockerfile: customized-extraction/Dockerfile
    environment:
      INTERNAL_API_BASE_URL: http://api:3000/api
      CUSTOMIZED_EXTRACTION_WORKER_TOKEN: ${CUSTOMIZED_EXTRACTION_WORKER_TOKEN:?required}
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
      CUSTOMIZED_EXTRACTION_QUEUE: customized.extraction.requested
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_DOCUMENT_MODEL: ${ARK_DOCUMENT_MODEL:-doubao-seed-2-1-pro-260628}
      CUSTOMIZED_EXTRACTION_MODEL_TIMEOUT_SECONDS: ${CUSTOMIZED_EXTRACTION_MODEL_TIMEOUT_SECONDS:-300}
      CUSTOMIZED_EXTRACTION_MAX_ATTEMPTS: ${CUSTOMIZED_EXTRACTION_MAX_ATTEMPTS:-2}
      CUSTOMIZED_EXTRACTION_MAX_OUTPUT_TOKENS: ${CUSTOMIZED_EXTRACTION_MAX_OUTPUT_TOKENS:-16384}
      CUSTOMIZED_EXTRACTION_RETRY_MAX_OUTPUT_TOKENS: ${CUSTOMIZED_EXTRACTION_RETRY_MAX_OUTPUT_TOKENS:-32768}
      CUSTOMIZED_EXTRACTION_REASONING_EFFORT: ${CUSTOMIZED_EXTRACTION_REASONING_EFFORT:-medium}
      CUSTOMIZED_EXTRACTION_AUDIT_REASONING_EFFORT: ${CUSTOMIZED_EXTRACTION_AUDIT_REASONING_EFFORT:-low}
      CUSTOMIZED_EXTRACTION_DOCUMENT_REASONING_EFFORT: ${CUSTOMIZED_EXTRACTION_DOCUMENT_REASONING_EFFORT:-low}
      DOCUMENT_MAX_CONCURRENCY: '1'
      DOCUMENT_CHUNK_TEXT_CHARS: ${DOCUMENT_CHUNK_TEXT_CHARS:-12000}
      DOCLING_ARTIFACTS_PATH: /models
      DOCLING_DEVICE: cpu
      OMP_NUM_THREADS: '1'
    volumes:
      - docling-models:/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      docling-model-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: '1.0'
    mem_limit: 2g
  effect-extraction-worker:
    image: richi-marketing-effect-extraction-worker:${RELEASE_TAG:-current}
    build:
      context: ./workers
      dockerfile: effect-extraction/Dockerfile
    environment:
      INTERNAL_API_BASE_URL: http://api:3000/api
      EFFECT_EXTRACTION_WORKER_TOKEN: ${EFFECT_EXTRACTION_WORKER_TOKEN:?required}
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
      EFFECT_EXTRACTION_QUEUE: effect.extraction.requested
      EXTRACTION_AI_PROVIDER: ${EXTRACTION_AI_PROVIDER:-ark}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_DOCUMENT_MODEL: ${ARK_DOCUMENT_MODEL:-doubao-seed-2-1-pro-260628}
      ARK_DOCUMENT_TIMEOUT_SECONDS: ${ARK_DOCUMENT_TIMEOUT_SECONDS:-180}
      ARK_DOCUMENT_MAX_ATTEMPTS: ${ARK_DOCUMENT_MAX_ATTEMPTS:-1}
      ARK_DOCUMENT_MAX_OUTPUT_TOKENS: ${ARK_DOCUMENT_MAX_OUTPUT_TOKENS:-8192}
      ARK_DOCUMENT_REASONING_EFFORT: ${ARK_DOCUMENT_REASONING_EFFORT:-minimal}
      DOCUMENT_CHUNK_TEXT_CHARS: ${DOCUMENT_CHUNK_TEXT_CHARS:-12000}
      DOCUMENT_MAX_CONCURRENCY: '1'
      ARK_IMAGE_MODEL: ${ARK_IMAGE_MODEL:-}
      ARK_IMAGE_DETAIL: ${ARK_IMAGE_DETAIL:-low}
      ARK_IMAGE_REASONING_EFFORT: ${ARK_IMAGE_REASONING_EFFORT:-minimal}
      ARK_IMAGE_ADAPTIVE_HIGH_DETAIL: ${ARK_IMAGE_ADAPTIVE_HIGH_DETAIL:-true}
      ARK_IMAGE_TIMEOUT_SECONDS: ${ARK_IMAGE_TIMEOUT_SECONDS:-90}
      ARK_IMAGE_MAX_ATTEMPTS: ${ARK_IMAGE_MAX_ATTEMPTS:-2}
      ARK_IMAGE_MAX_OUTPUT_TOKENS: ${ARK_IMAGE_MAX_OUTPUT_TOKENS:-4096}
      ARK_IMAGE_RETRY_MAX_OUTPUT_TOKENS: ${ARK_IMAGE_RETRY_MAX_OUTPUT_TOKENS:-6144}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-1280}
      IMAGE_MAX_CONCURRENCY: '1'
      ARK_COMMERCE_MODEL: ${ARK_COMMERCE_MODEL:-}
      ARK_SEMANTIC_MODEL: ${ARK_SEMANTIC_MODEL:-doubao-seed-2-1-pro-260628}
      ARK_SEMANTIC_TIMEOUT_SECONDS: ${ARK_SEMANTIC_TIMEOUT_SECONDS:-30}
      ARK_SEMANTIC_MAX_ATTEMPTS: ${ARK_SEMANTIC_MAX_ATTEMPTS:-1}
      ARK_SEMANTIC_MAX_OUTPUT_TOKENS: ${ARK_SEMANTIC_MAX_OUTPUT_TOKENS:-3072}
      ARK_SEMANTIC_REASONING_EFFORT: ${ARK_SEMANTIC_REASONING_EFFORT:-minimal}
      ARK_SEMANTIC_USER_REVIEW_REASONING_EFFORT: ${ARK_SEMANTIC_USER_REVIEW_REASONING_EFFORT:-minimal}
      ARK_NORMALIZATION_MODEL: ${ARK_NORMALIZATION_MODEL:-}
      COMMERCE_RENDERER_MAX_CONCURRENCY: '1'
