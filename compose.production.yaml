    mem_limit: 1536m
  api:
    image: richi-marketing-api:${RELEASE_TAG:-current}
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    env_file:
      - .env.production
    environment:
      API_PORT: '3000'
      APP_ENV: production
      NODE_ENV: production
      AUTH_TRUST_PROXY_HOPS: '1'
    volumes:
      - api-files:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: nginx:alpine
    ports:
      - ${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-18080}:80
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 96m
    cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data: null
  redis-data: null
  rabbitmq-data: null
  docling-models: null
  api-files: null
