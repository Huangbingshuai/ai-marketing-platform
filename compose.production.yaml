      COMMERCE_RENDERER_MAX_DOM_BYTES: ${COMMERCE_RENDERER_MAX_DOM_BYTES:-2097152}
      COMMERCE_RENDERER_SETTLE_MILLISECONDS: ${COMMERCE_RENDERER_SETTLE_MILLISECONDS:-750}
      DOCLING_ARTIFACTS_PATH: /models
      DOCLING_DEVICE: cpu
      OMP_NUM_THREADS: '1'
    volumes:
      - docling-models:/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      docling-model-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    init: true
    shm_size: 1gb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
